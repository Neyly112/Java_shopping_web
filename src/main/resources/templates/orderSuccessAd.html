<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Shop Homepage - Start Bootstrap Template</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <style>
        body {
            font-size: 16px;
            background-color: #f8f9fa;
        }

        .card {
            margin-top: 20px;
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .title h4 {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            color: #fff;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }

        .back-to-shop a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }

        .back-to-shop a:hover {
            text-decoration: underline;
        }

        .back-to-shop i {
            font-size: 24px;
            margin-right: 10px;
            color: #007bff;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-custom navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/indexAdmin}">
            <img th:src="@{/images/logo1.jpg}" alt="Bootstrap" height="45">
        </a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/indexAdmin}">Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/ordersAd}">My order</a></li>
                        <li><a class="dropdown-item" href="index.php?act=qldh">Quản lý đơn hàng</a></li>
                        <li><a class="dropdown-item" href="index.php?act=qlsp">Quản lý sản phẩm</a></li>
                        <li><a class="dropdown-item" href="index.php?act=qlsp">Quản lý user</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/about}">About</a>

            </ul>

            <form class="d-flex" role="search" method="get" th:action="@{/searchAd}">
                <input class="form-control me-2" name="keyword" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="d-flex">
                <div> Hello
                    <span th:text="${currentUserName}">User</span>
                </div>
            </div>


            <form class="d-flex" th:action="@{/cartAd}">
                <button class="btn btn-outline-dark me-auto mb-2 mb-lg-0 ms-lg-4" type="submit">
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                </button>
            </form>
            <div><a class="nav-link logout-link me-auto mb-2 mb-lg-0 ms-lg-4" th:href="@{/logout}">Logout</a></div>

        </div>
    </div>
</nav>
<div class="container card">
    <div class="row">
        <div class="col-md-12 text-center">
            <div class="title">
                <h4>Order Confirmation</h4>
            </div>
            <div class="alert alert-success" role="alert">
                Your order has been placed successfully!
            </div>

            <p>Date: <strong th:text="${order.date}">2023-05-01</strong></p>
            <p>Total: <strong th:text="${order.total}">€0.00</strong></p>
            <div class="back-to-shop"><i class="bi bi-arrow-left"></i> <a th:href="@{/indexAdmin}">Back to shop</a></div>
        </div>
    </div>
</div>

<footer class="py-5">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a th:href="@{/index}" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a th:href="@{/about}" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 2024 Company, Inc</p>
</footer>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
