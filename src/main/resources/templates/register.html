<!-- Registration 13 - Bootstrap Brain Component -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<link rel="stylesheet" href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<section class="bg-light py-3 py-md-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
                <div class="card border border-light-subtle rounded-3 shadow-sm">
                    <div class="card-body p-3 p-md-4 p-xl-5">
                        <div class="text-center mb-3">
                            <a th:href="@{/}">
                                <img th:src="@{/images/logo1.jpg}" alt="BootstrapBrain Logo" width="175" height="120">
                            </a>
                        </div>
                        <h2 class="fs-6 fw-normal text-center text-secondary mb-4">Enter your details to register</h2>
                        <div th:if="${param.success}">
                            <div class="alert alert-info">
                                You have successfully registered our app!
                            </div>
                        </div>
                        <form th:action="@{/register}" method="post" th:object = "${userCheck}">
                            <div class="row gy-2 overflow-hidden">
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input type="text" th:feild="*{username}" class="form-control" name="username" id="username" placeholder="Username" required>
                                        <label for="username"  class="form-label">Username</label>
                                        <p th:errors = "*{username}" class="text-danger"
                                           th:if="${#fields.hasErrors('username')}"></p>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" th:feild="*{fname}" class="form-control" name = "fname" id="fname" placeholder="Enter first name" required>
                                        <label for="fname"  class="form-label">First Name</label>
                                        <p th:errors = "*{fname}" class="text-danger"
                                           th:if="${#fields.hasErrors('fname')}"></p>
                                    </div>
                                    <div class="form-floating mb-3">
                                        <input type="text" th:field="*{lname}" class="form-control" name="lname" id="lname" placeholder="Enter last name" required>
                                        <label for="lname" class="form-label">Last Name</label>
                                        <p th:errors = "*{lname}" class="text-danger"
                                           th:if="${#fields.hasErrors('lname')}"></p>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input type="password" th:field="*{password}" class="form-control" name="password" id="password" value="" placeholder="Password" required>
                                        <label for="password" class="form-label">Password</label>
                                        <p th:errors = "*{password}" class="text-danger"
                                           th:if="${#fields.hasErrors('password')}"></p>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating mb-3">
                                        <input type="email" th:field="*{email}" class="form-control" name="email" id="email" placeholder="name@gmail.com" required>
                                        <label for="email" class="form-label">Email</label>
                                        <p th:errors = "*{email}" class="text-danger"
                                           th:if="${#fields.hasErrors('email')}"></p>
                                    </div>
                                </div>

                                <div class="col-12">
                                    <div class="d-grid my-3">
                                        <button class="btn btn-primary btn-lg" type="submit">Sign up</button>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <p class="m-0 text-secondary text-center">Already have an account? <a th:href="@{/login}" class="link-primary text-decoration-none">Sign in</a></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
