<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>


    <style>
        .card-img-top {
            max-width: 100%;
            height: auto;
        }

        .card {
            max-width: 600px;
            margin: auto;
        }

        .navbar-custom {
            background-color: #e0e0e0;
        }
        .login-link {
            color: #ffffff;
            background-color: #28a745; /* Màu nền xanh */
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link:hover {
            background-color: #218838;
            color: #ffffff;
        }
    </style>
</head>
<body>
<!-- Navigation-->
<nav class="navbar navbar-custom navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/}">
            <img th:src="@{/images/logo1.jpg}" alt="Bootstrap" height="45">
        </a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button" data-toggle="dropdown" aria-expanded="false">
                        Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#" onclick="checkLogin(even)">My order</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/about}">About</a>

            </ul>

            <form class="d-flex" role="search" method="get" th:action="@{/search}">
                <input class="form-control me-2" name="keyword" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="d-flex">
                <button class="btn btn-outline-dark me-auto mb-2 mb-lg-0 ms-lg-4" type="submit" onclick="checkLogin()">
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                </button>
            </div>
            <div><a class="nav-link login-link me-auto mb-2 mb-lg-0 ms-lg-4" th:href="@{/login}">Login</a></div>

        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <h1 class="text-center">Product Detail</h1>
    <div class="card mb-3">
        <img class="card-img-top small-img" th:src="@{|/images/${product.image}|}" alt="Product Image">

        <div class="card-body">
            <h5>Product Name:</h5>
            <h5 class="card-title" th:text="${product.name}"></h5>
            <div>Category:</div>
            <p class="card-text" th:text="${product.category}">Category</p>
            <div>Brand:</div>
            <p class="card-text" th:text="${product.brand}">Brand</p>
            <div>Color:</div>
            <p class="card-text" th:text="${product.color}">Color</p>
            <div>Description:</div>
            <p class="card-text" th:text="${product.description}">Description</p>
            <div>Price:</div>
            <p class="card-text" th:text="${product.price}">$0.00</p>
            <!-- Add to Cart button -->
            <div class="text-center">
                <button class="btn btn-outline-dark mt-auto" onclick="checkLogin()">Add to cart</button>
            </div>
        </div>
    </div>
    <a th:href="@{/}" class="btn btn-primary">Back to Home</a>
</div>

<!-- Footer -->
<footer class="py-5">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a th:href="@{/index}" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a th:href="@{/about}" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 2024 Company, Inc</p>
</footer>
<!-- JavaScript files-->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    // Giả sử chúng ta có biến 'isLoggedIn' trên server, truyền nó vào trang HTML thông qua Thymeleaf
    var isLoggedIn = false;

    function checkLogin(event) {
        event.preventDefault();
        if (!isLoggedIn) {
            alert('Bạn cần đăng nhập để truy cập mục này!');
            return false;
        }

    }

</script>
</body>
</html>
