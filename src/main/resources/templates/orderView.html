<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <meta name="description" content=""/>
    <meta name="author" content=""/>
    <title>Shop Homepage - Start Bootstrap Template</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>
    <!-- Bootstrap icons-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <!-- Core theme CSS (includes Bootstrap)-->
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <style>
        .navbar-custom {
            background-color: #e0e0e0;
        }

        .logout-link, .login-link {
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-link {
            color: #ffffff;
            background-color: #dc3545; /* Màu nền đỏ */
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-link:hover {
            background-color: #c82333; /* Màu nền đỏ đậm hơn khi hover */
            color: #ffffff;
        }
    </style>
</head>
<body>
<!-- Header -->
<nav class="navbar navbar-custom navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/indexAdmin}">
            <img th:src="@{/images/logo1.jpg}" alt="Bootstrap" height="45">
        </a>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/indexAdmin}">Home</a>
                </li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/ordersAd}">My order</a></li>
                        <li><a class="dropdown-item" th:href="@{/orderManagement}">Order Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/products}">Product Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/userManagement}">User Management</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/about}">About</a>

            </ul>

            <form class="d-flex" role="search" method="get" th:action="@{/searchAd}">
                <input class="form-control me-2" name="keyword" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="d-flex">
                <div> Hello
                    <span th:text="${currentUserName}">User</span>
                </div>
            </div>

            <form class="d-flex" th:action="@{/cartAd}">
                <button class="btn btn-outline-dark me-auto mb-2 mb-lg-0 ms-lg-4" type="submit">
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                </button>
            </form>
            <div><a class="nav-link logout-link me-auto mb-2 mb-lg-0 ms-lg-4" th:href="@{/logout}">Logout</a></div>

        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <h1 class="text-center">Order Details</h1>
    <div th:if="${order == null}" class="alert alert-warning text-center">
        No order found.
    </div>
    <div th:if="${order != null}">
        <div class="card mb-3">
            <div class="card-body">
                <p class="card-text">Order Date: <span
                        th:text="${#dates.format(order.date, 'yyyy-MM-dd HH:mm')}"></span></p>
                <p class="card-text">Status: <span th:text="${order.status}"></span></p>
                <p class="card-text">Name: <span th:text="${order.name}"></span></p>
                <p class="card-text">Address: <span th:text="${order.address}"></span></p>
                <p class="card-text">Phone: <span th:text="${order.phone}"></span></p>
                <h5>Products:</h5>
                <ul>
                    <li th:each="item : ${order.orderItems}">
                        <img th:src="@{|/images/${item.product.image}|}" alt="Product Image" class="img-fluid"
                             style="max-width: 50px; max-height: 50px; margin-right: 10px;">
                        <span th:text="${item.product.name}"></span> -
                        <span th:text="${item.quantity}"></span> x
                        <span th:text="${item.price}"></span> =
                        <span th:text="${order.total}"></span>
                    </li>
                </ul>
                <p class="card-text">Total: <span th:text="${order.total}"></span></p>

            </div>
        </div>
    </div>
</div>


<!-- Footer -->
<footer class="py-5">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a th:href="@{/index}" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a th:href="@{/about}" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 2024 Company, Inc</p>
</footer>
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</body>
</html>
