<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Additional CSS -->
    <link th:href="@{/css/styles.css}" rel="stylesheet"/>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico"/>
    <!-- Bootstrap icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet"/>

    <style>
        .navbar-custom {
            background-color: #e0e0e0;
        }

        .logout-link {
            color: #ffffff;
            background-color: #dc3545; /* Màu nền đỏ */
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .logout-link:hover {
            background-color: #c82333; /* Màu nền đỏ đậm hơn khi hover */
            color: #ffffff;
        }
    </style>
</head>
<body>
<!-- Navigation -->
<nav class="navbar navbar-custom navbar-expand-lg navbar-light bg-light">
    <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/indexAdmin}">
            <img th:src="@{/images/logo1.jpg}" alt="Bootstrap" height="45">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/indexAdmin}">Home</a></li>
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" role="button" data-toggle="dropdown" aria-expanded="false">
                        Account
                    </a>
                    <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" th:href="@{/ordersAd}">My order</a></li>
                        <li><a class="dropdown-item" th:href="@{/ordersAc}">Order Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/products}">Product Management</a></li>
                        <li><a class="dropdown-item" th:href="@{/users}">User management</a></li>
                    </ul>
                </li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" th:href="@{/about}">About</a>

            </ul>

            <form class="d-flex" role="search" method="get" th:action="@{/searchAd}">
                <input class="form-control me-2" name="keyword" type="search" placeholder="Search" aria-label="Search">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
            <div class="d-flex">
                <div>Hello
                    <span th:text="${currentUserName}">User</span>
                </div>
            </div>

            <form class="d-flex" th:action="@{/cartAd}">
                <button class="btn btn-outline-dark me-auto mb-2 mb-lg-0 ms-lg-4" type="submit">
                    <i class="bi-cart-fill me-1"></i>
                    Cart
                </button>
            </form>
            <div><a class="nav-link logout-link me-auto mb-2 mb-lg-0 ms-lg-4" th:href="@{/logout}">Logout</a></div>
        </div>
    </div>
</nav>

<!-- Main Content -->
<div class="container mt-5">
    <h1 class="text-center">Your Orders</h1>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
            <tr>

                <th>Date</th>
                <th>Total Amount</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">

                <td th:text="${order.date}">2024-11-17</td>
                <td th:text="${order.total}">$0.00</td>
                <td th:text="${order.status}">Pending</td>
                <td><a th:href="@{|/ordersAd/${order.id}|}" class="btn btn-primary">View</a></td>
            </tr>
            <tr th:if="${orders.size() == 0}">
                <td colspan="5" class="text-center">No orders!</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Footer -->
<footer class="py-5">
    <ul class="nav justify-content-center border-bottom pb-3 mb-3">
        <li class="nav-item"><a th:href="@{/index}" class="nav-link px-2 text-body-secondary">Home</a></li>
        <li class="nav-item"><a th:href="@{/about}" class="nav-link px-2 text-body-secondary">About</a></li>
    </ul>
    <p class="text-center text-body-secondary">© 2024 Company, Inc</p>
</footer>
<!-- JavaScript files -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    // Giả sử chúng ta có biến 'isLoggedIn' trên server, truyền nó vào trang HTML thông qua Thymeleaf
    var isLoggedIn = /*[[${isLoggedIn}]]*/ false;

    function checkLogin(event) {
        event.preventDefault();
        if (!isLoggedIn) {
            alert('Bạn cần đăng nhập để truy cập mục này!');
            return false;
        }
        window.location.href = event.target.href;
    }

    // Ensure dropdown collapses after selection
    $('.dropdown-menu a').on('click', function () {
        $('.navbar-collapse').collapse('hide');
    });
</script>
</body>
</html>
